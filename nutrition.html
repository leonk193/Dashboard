<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050506">
    <title>Nutrition - Leon Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="sync.js" defer></script>
    <script src="topbar.js" defer></script>
    <style>
        :root {
            --text-primary: #FAFAFA;
            --text-secondary: #B8B6B0;
            --text-tertiary: #76746E;
            --success: #6BE3A4;
            --warning: #F2C063;
            --danger: #FF6B6B;
            --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background: #050506;
            color: var(--text-secondary);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            min-height: 100vh; position: relative; overflow-x: hidden;
            padding: max(28px, env(safe-area-inset-top)) 20px 60px;
        }
        body::before {
            content: ""; position: fixed; inset: 0;
            background:
                radial-gradient(circle at 82% 14%, rgba(224,118,88,0.16), transparent 45%),
                radial-gradient(circle at 18% 90%, rgba(180,180,200,0.06), transparent 50%);
            filter: blur(40px); pointer-events: none; z-index: -2;
            animation: drift 36s ease-in-out infinite alternate;
        }
        body::after {
            content: ""; position: fixed; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
            background-size: 3px 3px; pointer-events: none; z-index: -1;
        }
        @keyframes drift { 0%{transform:translate3d(0,0,0)} 100%{transform:translate3d(-22px,14px,0)} }

        .page { max-width: 1100px; margin: 0 auto; }
        .dash-title {
            margin: 0 0 18px; font-size: 28px; font-weight: 700; letter-spacing: -0.025em;
            background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }
        @media (max-width: 480px) { .dash-title { font-size: 22px; } }

        /* Tab Styles */
        .tab-container { display: flex; flex-direction: column; gap: 24px; }
        .tab-header {
            display: flex;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            overflow: hidden;
        }
        .tab-button {
            flex: 1;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-align: center;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .tab-button.active {
            color: var(--text-primary);
            background: rgba(255,255,255,0.08);
        }
        .tab-button.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--success), var(--warning));
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Meal Form Styles */
        .meal-form {
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            box-shadow: 0 12px 40px rgba(0,0,0,0.45);
        }
        .form-section { margin-bottom: 24px; }
        .form-section-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-section-title::before {
            content: "";
            width: 18px;
            height: 1px;
            background: var(--text-tertiary);
            opacity: 0.6;
        }
        .form-field { margin-bottom: 16px; }
        .field-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 6px;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .input-control {
            flex: 1;
            min-width: 120px;
            display: flex;
            flex-direction: column;
        }
        input, select, textarea {
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            background: rgba(0,0,0,0.28);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: rgba(255,255,255,0.28);
            background: rgba(0,0,0,0.36);
        }
        input::placeholder {
            color: var(--text-tertiary);
        }
        .textarea-control {
            min-height: 80px;
            resize: vertical;
        }
        .photo-upload {
            aspect-ratio: 16/9;
            background: rgba(255,255,255,0.03);
            border: 2px dashed rgba(255,255,255,0.12);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .photo-upload:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.16);
        }
        .photo-upload-icon {
            font-size: 24px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .photo-upload-text {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #0A0A0B;
            background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 8px rgba(0,0,0,0.35), 0 8px 22px rgba(0,0,0,0.25);
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.15s ease;
        }
        .submit-btn:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .form-status {
            min-height: 16px;
            margin-top: 8px;
            font-size: 12px;
            text-align: center;
        }

        /* Summary Tab Styles */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .progress-ring-container {
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }

        .progress-ring {
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            position: relative;
        }

        .progress-ring svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .progress-ring-track {
            fill: none;
            stroke: rgba(255,255,255,0.06);
            stroke-width: 8;
        }

        .progress-ring-fill {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 60px 60px;
            transition: stroke 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                       stroke-dashoffset 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .progress-ring-percent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: var(--text-primary);
        }

        .progress-ring-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .progress-ring-subtext {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        .progress-ring.goal-met .progress-ring-fill {
            stroke: var(--success);
        }

        .progress-ring.goal-exceeded .progress-ring-fill {
            stroke: linear-gradient(90deg, var(--success), var(--warning));
        }

        .daily-total {
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            margin-top: 16px;
        }

        .daily-total-label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .daily-total-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .daily-total-unit {
            font-size: 14px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .macro-breakdown {
            margin-top: 24px;
        }

        .macro-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .macro-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .macro-value {
            font-size: 14px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
        }

        /* History Tab Styles */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }

        .meal-list {
            margin-bottom: 24px;
        }

        .meal-item {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .meal-item:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.08);
        }

        .meal-photo {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .meal-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .meal-details {
            flex: 1;
        }

        .meal-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .meal-time {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .meal-macros {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .macro-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .macro-label-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-tertiary);
        }

        .macro-value-badge {
            font-weight: 700;
            color: var(--text-secondary);
        }

        .meal-calories {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .meal-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
        }

        .edit-btn:hover {
            color: var(--success);
        }

        .delete-btn:hover {
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-tertiary);
            font-size: 16px;
        }

        .empty-state-icon {
            font-size: 32px;
            margin-bottom: 16px;
            color: var(--text-tertiary);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .page {
                padding: max(20px, env(safe-area-inset-top)) 16px 50px;
            }

            .tab-header {
                flex-wrap: wrap;
            }

            .tab-button {
                flex: 1 0 50%;
                padding: 14px 16px;
                font-size: 14px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .meal-item {
                flex-direction: column;
                align-items: stretch;
            }

            .meal-photo {
                width: 100%;
                height: 200px;
            }
        }

        @media (max-width: 480px) {
            .page {
                padding: max(16px, env(safe-area-inset-top)) 12px 40px;
            }

            .dash-title {
                font-size: 20px;
            }

            .tab-button {
                flex: 1 0 100%;
                padding: 12px 14px;
                font-size: 13px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .progress-ring {
                width: 100px;
                height: 100px;
            }

            .progress-ring-percent {
                font-size: 24px;
            }

            .daily-total-value {
                font-size: 24px;
            }

            .input-control {
                flex: 1 0 100%;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="hub-head">
            <h1 class="dash-title">Nutrition</h1>
            <button class="gear-btn" id="settingsOpen" type="button" aria-label="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>

        <div class="tab-container">
            <!-- Tab Header -->
            <div class="tab-header">
                <button class="tab-button active" data-tab="log">Log Meal</button>
                <button class="tab-button" data-tab="summary">Daily Summary</button>
                <button class="tab-button" data-tab="history">Meal History</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content active" id="log-tab">
                <div class="meal-form">
                    <form id="mealForm">
                        <div class="form-section">
                            <h2 class="form-section-title">Meal Details</h2>
                            <div class="form-field">
                                <label class="field-label">Meal Name</label>
                                <input type="text" id="mealName" placeholder="e.g., Chicken Salad, Protein Shake" autocomplete="off">
                                <div id="foodDisclaimer" style="font-size: 12px; color: var(--text-tertiary); margin-top: 4px; display: none;"></div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h2 class="form-section-title">Nutrition</h2>
                            <div class="input-group">
                                <div class="input-control">
                                    <label class="field-label">Calories</label>
                                    <input type="number" id="mealCalories" min="0" placeholder="0">
                                </div>
                                <div class="input-control">
                                    <label class="field-label">Protein (g)</label>
                                    <input type="number" id="mealProtein" min="0" step="0.1" placeholder="0">
                                </div>
                                <div class="input-control">
                                    <label class="field-label">Carbs (g)</label>
                                    <input type="number" id="mealCarbs" min="0" step="0.1" placeholder="0">
                                </div>
                                <div class="input-control">
                                    <label class="field-label">Fat (g)</label>
                                    <input type="number" id="mealFat" min="0" step="0.1" placeholder="0">
                                </div>
                            </div>
                        </div>

                        <div class="form-status" id="formStatus"></div>
                        <button type="submit" class="submit-btn">Log Meal</button>
                    </form>
                </div>
            </div>

            <div class="tab-content" id="summary-tab">
                <div class="summary-grid">
                    <div class="progress-ring-container">
                        <div class="progress-ring" id="caloriesRing">
                            <svg viewBox="0 0 120 120">
                                <circle class="progress-ring-track" cx="60" cy="60" r="52" />
                                <circle class="progress-ring-fill" cx="60" cy="60" r="52" id="caloriesFill" />
                            </svg>
                            <div class="progress-ring-percent" id="caloriesPercent">0%</div>
                            <div class="progress-ring-label">Calories</div>
                            <div class="progress-ring-subtext" id="caloriesSubtext">0 / 2000 kcal</div>
                        </div>
                    </div>

                    <div class="progress-ring-container">
                        <div class="progress-ring" id="proteinRing">
                            <svg viewBox="0 0 120 120">
                                <circle class="progress-ring-track" cx="60" cy="60" r="52" />
                                <circle class="progress-ring-fill" cx="60" cy="60" r="52" id="proteinFill" />
                            </svg>
                            <div class="progress-ring-percent" id="proteinPercent">0%</div>
                            <div class="progress-ring-label">Protein</div>
                            <div class="progress-ring-subtext" id="proteinSubtext">0 / 150 g</div>
                        </div>
                    </div>

                    <div class="progress-ring-container">
                        <div class="progress-ring" id="carbsRing">
                            <svg viewBox="0 0 120 120">
                                <circle class="progress-ring-track" cx="60" cy="60" r="52" />
                                <circle class="progress-ring-fill" cx="60" cy="60" r="52" id="carbsFill" />
                            </svg>
                            <div class="progress-ring-percent" id="carbsPercent">0%</div>
                            <div class="progress-ring-label">Carbs</div>
                            <div class="progress-ring-subtext" id="carbsSubtext">0 / 250 g</div>
                        </div>
                    </div>

                    <div class="progress-ring-container">
                        <div class="progress-ring" id="fatRing">
                            <svg viewBox="0 0 120 120">
                                <circle class="progress-ring-track" cx="60" cy="60" r="52" />
                                <circle class="progress-ring-fill" cx="60" cy="60" r="52" id="fatFill" />
                            </svg>
                            <div class="progress-ring-percent" id="fatPercent">0%</div>
                            <div class="progress-ring-label">Fat</div>
                            <div class="progress-ring-subtext" id="fatSubtext">0 / 70 g</div>
                        </div>
                    </div>
                </div>

                <div class="daily-total">
                    <div class="daily-total-label">Total Calories Consumed</div>
                    <div class="daily-total-value" id="dailyTotalValue">0</div>
                    <div class="daily-total-unit">kcal</div>
                </div>

                <div class="macro-breakdown">
                    <div class="macro-item">
                        <span class="macro-label">Protein</span>
                        <span class="macro-value" id="dailyProtein">0</span>g
                    </div>
                    <div class="macro-item">
                        <span class="macro-label">Carbs</span>
                        <span class="macro-value" id="dailyCarbs">0</span>g
                    </div>
                    <div class="macro-item">
                        <span class="macro-label">Fat</span>
                        <span class="macro-value" id="dailyFat">0</span>g
                    </div>
                </div>
            </div>

            <div class="tab-content" id="history-tab">
                <div class="history-header">
                    <h2 class="history-title">Meal History</h2>
                    <button class="filter-btn" id="filterBtn">Today</button>
                </div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">🍽️</div>
                    <p>No meals logged yet. Start by logging your first meal!</p>
                </div>

                <div class="meal-list" id="mealList"></div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // Initialize cloud sync for nutrition data
            window.initCloudSync({
                appKey: 'nutrition_data',
                syncedKeys: ['nutrition_meals'],
                onApplied: () => {
                    // Update UI when synced data is applied
                    if (document.getElementById('summary-tab').classList.contains('active')) {
                        updateDailySummary();
                    }
                    if (document.getElementById('history-tab').classList.contains('active')) {
                        loadMealHistory();
                    }
                }
            });

            // Tab switching functionality
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const tabId = button.getAttribute('data-tab');

                    // Update active tab button
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    // Update active tab content
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                        if (content.id === `${tabId}-tab`) {
                            content.classList.add('active');
                        }
                    });
                });
            });

            // Meal form handling
            const mealForm = document.getElementById('mealForm');
            const formStatus = document.getElementById('formStatus');
            const foodDisclaimer = document.getElementById('foodDisclaimer');

            // Debounce function for Open Food Facts search
            function debounce(func, delay) {
                let timeoutId;
                return function (...args) {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => func.apply(this, args), delay);
                };
            }

            // Search Open Food Facts for meal name
            async function searchOpenFoodFacts(mealName) {
                if (!mealName || mealName.length < 2) {
                    foodDisclaimer.style.display = 'none';
                    return;
                }
                try {
                    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(mealName)}&json=1`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.count > 0 && data.products && data.products.length > 0) {
                        const product = data.products[0];
                        const nutrients = {
                            calories: product['energy-kcal_100g'] || 0,
                            protein: product['proteins_100g'] || 0,
                            carbs: product['carbohydrates_100g'] || 0,
                            fat: product['fat_100g'] || 0
                        };
                        // Fill the form
                        document.getElementById('mealCalories').value = nutrients.calories || '';
                        document.getElementById('mealProtein').value = nutrients.protein || '';
                        document.getElementById('mealCarbs').value = nutrients.carbs || '';
                        document.getElementById('mealFat').value = nutrients.fat || '';
                        // Show disclaimer
                        const productName = product.product_name || mealName;
                        foodDisclaimer.textContent = `Values are per 100g (based on "${productName}"). Adjust if your portion is different.`;
                        foodDisclaimer.style.display = 'block';
                    } else {
                        foodDisclaimer.style.display = 'none';
                    }
                } catch (error) {
                    console.error('Error searching Open Food Facts:', error);
                    foodDisclaimer.style.display = 'none';
                }
            }

            // Add event listener to meal name input with debounce
            const mealNameInput = document.getElementById('mealName');
            mealNameInput.addEventListener('input', debounce(() => {
                searchOpenFoodFacts(mealNameInput.value.trim());
            }, 300));

            // Form submission
            mealForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Get form values
                const mealData = {
                    name: document.getElementById('mealName').value.trim(),
                    // Time is set to current time
                    time: new Date().toLocaleTimeString('en-CA', {hour12: false, hour: '2-digit', minute: '2-digit'}),
                    calories: parseInt(document.getElementById('mealCalories').value) || 0,
                    protein: parseFloat(document.getElementById('mealProtein').value) || 0,
                    carbs: parseFloat(document.getElementById('mealCarbs').value) || 0,
                    fat: parseFloat(document.getElementById('mealFat').value) || 0,
                    timestamp: new Date().toISOString(),
                    date: new Date().toISOString().split('T')[0]
                };

                // Validation
                let isValid = true;
                let errorMessage = '';

                // Validate meal name
                if (!mealData.name) {
                    isValid = false;
                    errorMessage = 'Please enter a meal name.';
                }
                // Validate nutrition values
                else if (isNaN(mealData.calories) || mealData.calories < 0) {
                    isValid = false;
                    errorMessage = 'Calories must be a non-negative number.';
                }
                else if (isNaN(mealData.protein) || mealData.protein < 0) {
                    isValid = false;
                    errorMessage = 'Protein must be a non-negative number.';
                }
                else if (isNaN(mealData.carbs) || mealData.carbs < 0) {
                    isValid = false;
                    errorMessage = 'Carbs must be a non-negative number.';
                }
                else if (isNaN(mealData.fat) || mealData.fat < 0) {
                    isValid = false;
                    errorMessage = 'Fat must be a non-negative number.';
                }
                else if (mealData.calories === 0 && mealData.protein === 0 && mealData.carbs === 0 && mealData.fat === 0) {
                    isValid = false;
                    errorMessage = 'Please enter at least one nutrition value.';
                }

                if (!isValid) {
                    showFormStatus(errorMessage, true);
                    return;
                }

                try {
                    // Save to localStorage first
                    await saveMealToLocalStorage(mealData);

                    // If Supabase sync is configured, save to backend (no photo upload)
                    if (window.supabase) {
                        await syncMealToSupabase(mealData);
                    }

                    // Reset form
                    mealForm.reset();
                    foodDisclaimer.style.display = 'none'; // Hide disclaimer when resetting form

                    showFormStatus('Meal logged successfully!', false);

                    // Update displays if we're on summary or history tabs
                    if (document.getElementById('summary-tab').classList.contains('active')) {
                        updateDailySummary();
                    }
                    if (document.getElementById('history-tab').classList.contains('active')) {
                        loadMealHistory();
                    }

                } catch (error) {
                    console.error('Error logging meal:', error);
                    showFormStatus('Failed to log meal. Please try again.', true);
                }
            });

            function showFormStatus(message, isError) {
                formStatus.textContent = message;
                formStatus.className = `form-status ${isError ? 'error' : 'success'}`;

                // Clear status after 3 seconds
                setTimeout(() => {
                    formStatus.textContent = '';
                    formStatus.className = 'form-status';
                }, 3000);
            }

            async function saveMealToLocalStorage(mealData) {
                // Get existing meals
                const meals = JSON.parse(localStorage.getItem('nutrition_meals') || '[]');

                // Add new meal with ID
                const newMeal = {
                    id: Date.now() + Math.random(),
                    ...mealData
                };

                meals.push(newMeal);
                localStorage.setItem('nutrition_meals', JSON.stringify(meals));

                // Trigger storage event for other tabs
                window.dispatchEvent(new Event('storage'));
            }

            async function syncMealToSupabase(mealData) {
                try {
                    // Save meal record (no photo, no notes)
                    const mealRecord = {
                        id: Date.now() + Math.random(),
                        name: mealData.name,
                        time: mealData.time,
                        calories: mealData.calories,
                        protein: mealData.protein,
                        carbs: mealData.carbs,
                        fat: mealData.fat,
                        photo_url: null,
                        notes: null,
                        timestamp: mealData.timestamp,
                        date: mealData.date
                    };

                    const { error } = await window.supabase
                        .from('nutrition_meals')
                        .insert([mealRecord]);

                    if (error) throw error;
                } catch (error) {
                    console.error('Supabase sync error:', error);
                    // Don't fail the whole operation if sync fails
                    throw error;
                }
            }

            // Daily Summary functionality
            function updateDailySummary() {
                const today = new Date().toISOString().split('T')[0];
                const meals = JSON.parse(localStorage.getItem('nutrition_meals') || '[]');
                const todaysMeals = meals.filter(meal => meal.date === today);

                const totals = todaysMeals.reduce((acc, meal) => ({
                    calories: acc.calories + (meal.calories || 0),
                    protein: acc.protein + (meal.protein || 0),
                    carbs: acc.carbs + (meal.carbs || 0),
                    fat: acc.fat + (meal.fat || 0)
                }), { calories: 0, protein: 0, carbs: 0, fat: 0 });

                // Update daily totals
                document.getElementById('dailyTotalValue').textContent = Math.round(totals.calories);
                document.getElementById('dailyProtein').textContent = totals.protein.toFixed(1);
                document.getElementById('dailyCarbs').textContent = totals.carbs.toFixed(1);
                document.getElementById('dailyFat').textContent = totals.fat.toFixed(1);

                // Update progress rings (assuming goals: 2000 cal, 150g protein, 250g carbs, 70g fat)
                updateProgressRing('caloriesRing', totals.calories, 2000);
                updateProgressRing('proteinRing', totals.protein, 150);
                updateProgressRing('carbsRing', totals.carbs, 250);
                updateProgressRing('fatRing', totals.fat, 70);

                // Update subtext
                document.getElementById('caloriesSubtext').textContent = `${Math.round(totals.calories)} / 2000 kcal`;
                document.getElementById('proteinSubtext').textContent = `${totals.protein.toFixed(1)} / 150 g`;
                document.getElementById('carbsSubtext').textContent = `${totals.carbs.toFixed(1)} / 250 g`;
                document.getElementById('fatSubtext').textContent = `${totals.fat.toFixed(1)} / 70 g`;
            }

            function updateProgressRing(elementId, current, goal) {
                const fillElement = document.getElementById(`${elementId}Fill`);
                const percentElement = document.getElementById(`${elementId}Percent`);
                const ringElement = document.getElementById(elementId);

                const percentage = Math.min((current / goal) * 100, 100);
                const offset = 2 * Math.PI * 52 * (1 - percentage / 100);

                fillElement.setAttribute('stroke-dashoffset', offset);
                percentElement.textContent = `${Math.round(percentage)}%`;

                // Update ring color based on progress
                ringElement.classList.remove('goal-met', 'goal-exceeded');
                if (percentage >= 100) {
                    ringElement.classList.add('goal-exceeded');
                } else if (percentage >= 80) {
                    ringElement.classList.add('goal-met');
                }
            }

            // Meal History functionality
            function loadMealHistory() {
                const mealList = document.getElementById('mealList');
                const emptyState = document.getElementById('emptyState');
                const meals = JSON.parse(localStorage.getItem('nutrition_meals') || '[]');

                // Sort by date (newest first)
                const sortedMeals = [...meals].sort((a, b) =>
                    new Date(b.timestamp) - new Date(a.timestamp)
                );

                if (sortedMeals.length === 0) {
                    emptyState.style.display = 'block';
                    mealList.style.display = 'none';
                    return;
                }

                emptyState.style.display = 'none';
                mealList.style.display = 'block';

                mealList.innerHTML = '';

                sortedMeals.forEach(meal => {
                    const mealItem = document.createElement('div');
                    mealItem.className = 'meal-item';
                    mealItem.innerHTML = `
                        <div class="meal-photo" style="background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;">
                            <div style="font-size: 24px; color: var(--text-tertiary);">🍽️</div>
                        </div>
                        <div class="meal-details">
                            <div class="meal-name">${escapeHtml(meal.name)}</div>
                            <div class="meal-time">${new Date(meal.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                            <div class="meal-macros">
                                <div class="macro-badge">
                                    <span class="macro-label-badge">P</span>
                                    <span class="macro-value-badge">${meal.protein.toFixed(1)}g</span>
                                </div>
                                <div class="macro-badge">
                                    <span class="macro-label-badge">C</span>
                                    <span class="macro-value-badge">${meal.carbs.toFixed(1)}g</span>
                                </div>
                                <div class="macro-badge">
                                    <span class="macro-label-badge">F</span>
                                    <span class="macro-value-badge">${meal.fat.toFixed(1)}g</span>
                                </div>
                            </div>
                            <div class="meal-calories">${meal.calories} kcal</div>
                            <div class="meal-actions">
                                <button class="action-btn edit-btn" title="Edit meal" onclick="editMeal(${meal.id})">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4-1 1-4 9.5-9.5z"/>
                                    </svg>
                                </button>
                                <button class="action-btn delete-btn" title="Delete meal" onclick="deleteMeal(${meal.id})">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 6h18"/>
                                        <path d="M19 9v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9"/>
                                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                        <path d="M12 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                    mealList.appendChild(mealItem);
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function editMeal(id) {
                // TODO: Implement meal editing
                alert('Edit functionality coming soon!');
            }

            function deleteMeal(id) {
                if (!confirm('Are you sure you want to delete this meal?')) return;

                const meals = JSON.parse(localStorage.getItem('nutrition_meals') || '[]');
                const filteredMeals = meals.filter(meal => meal.id !== id);
                localStorage.setItem('nutrition_meals', JSON.stringify(filteredMeals));

                // Trigger storage update
                window.dispatchEvent(new Event('storage'));

                // Reload current tab if it's history
                if (document.getElementById('history-tab').classList.contains('active')) {
                    loadMealHistory();
                }

                // Update summary if viewing today
                if (document.getElementById('summary-tab').classList.contains('active')) {
                    updateDailySummary();
                }
            }

            // Initialize when tabs are shown
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const tabId = button.getAttribute('data-tab');
                    if (tabId === 'summary' && document.getElementById('summary-tab').classList.contains('active')) {
                        updateDailySummary();
                    } else if (tabId === 'history' && document.getElementById('history-tab').classList.contains('active')) {
                        loadMealHistory();
                    }
                });
            });

            // Handle storage events (when data changes from other tabs/windows)
            window.addEventListener('storage', () => {
                if (document.getElementById('summary-tab').classList.contains('active')) {
                    updateDailySummary();
                }
                if (document.getElementById('history-tab').classList.contains('active')) {
                    loadMealHistory();
                }
            });

            // Initial load
            document.addEventListener('DOMContentLoaded', () => {
                // Load initial data
                updateDailySummary();
                loadMealHistory();
            });

            // Settings modal (same as other pages)
            (function () {
                const $ = (id) => document.getElementById(id);

                function open() { populate(); renderWhoop(); $('settingsBg').classList.add('show'); syncWhoop(); }
                function close() { $('settingsBg').classList.remove('show'); }
                $('settingsOpen').addEventListener('click', open);
                $('settingsClose').addEventListener('click', close);
                $('settingsBg').addEventListener('click', (e) => { if (e.target == $('settingsBg')) close(); });
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
                $('settingsSave').addEventListener('click', save);

                // Unit switching (same as other pages)
                function setHeightUnit(u) {
                    heightUnit = u;
                    $('heightUnitSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.u === u));
                    const a = $('heightA'), b = $('heightB');
                    if (u === 'cm') { a.placeholder = 'cm'; b.style.display = 'none'; }
                    else { a.placeholder = 'ft'; b.placeholder = 'in'; b.style.display = ''; }
                }
                function setWeightUnit(u) {
                    weightUnit = u;
                    $('weightUnitSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.u === u));
                }
                function setSex(s) {
                    sex = s;
                    $('sexSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
                }

                let heightUnit = 'cm';
                let weightUnit = 'kg';
                let sex = 'm';

                function getHeightCm() {
                    if (heightUnit === 'cm') { const v = parseFloat($('heightA').value); return v > 0 ? v : null; }
                    const ft = parseFloat($('heightA').value) || 0;
                    const inch = parseFloat($('heightB').value) || 0;
                    const cm = ft * 30.48 + inch * 2.54;
                    return cm > 0 ? Math.round(cm) : null;
                }
                function fillHeight(cm) {
                    if (!cm) { $('heightA').value = ''; $('heightB').value = ''; return; }
                    if (heightUnit === 'cm') { $('heightA').value = Math.round(cm); }
                    else { const totalIn = cm / 2.54; $('heightA').value = Math.floor(totalIn / 12); $('heightB').value = Math.round(totalIn % 12); }
                }

                function populate() {
                    const w = loadJSON('po_water_v1', defaultWater());
                    const p = w.profile || {};
                    setWeightUnit(w.weightUnit === 'lb' ? 'lb' : 'kg');
                    setHeightUnit(p.heightUnit === 'ft' ? 'ft' : 'cm');
                    setSex(p.sex === 'f' ? 'f' : 'm');
                    fillHeight(p.heightCm || null);
                    if (p.weightKg) $('weight').value = weightUnit === 'lb' ? Math.round(p.weightKg * 2.20462) : Math.round(p.weightKg);
                    else $('weight').value = '';
                    $('age').value = p.age || '';
                    $('activity').value = (p.activityHrsPerWeek != null ? p.activityHrsPerWeek : '');
                }

                function loadJSON(k, f) { try { return JSON.parse(localStorage.getItem(k)) || f; } catch (e) { return f; } }
                function saveJSON(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

                function save() {
                    const w = loadJSON('po_water_v1', defaultWater());
                    w.profile = w.profile || {};
                    const cm = getHeightCm();
                    if (cm) { w.profile.heightCm = cm; w.profile.heightUnit = heightUnit; }
                    const wv = parseFloat($('weight').value);
                    if (wv > 0) { w.profile.weightKg = weightUnit === 'lb' ? +(wv / 2.20462).toFixed(1) : wv; w.weightUnit = weightUnit; }
                    const age = parseInt($('age').value, 10); if (age > 0) w.profile.age = age;
                    w.profile.sex = sex;
                    const act = parseFloat($('activity').value); if (act >= 0 && !isNaN(act)) w.profile.activityHrsPerWeek = act;
                    saveJSON('po_water_v1', w);
                    const s = $('settingsStatus'); s.textContent = 'Saved ✓';
                    setTimeout(() => { s.textContent = ''; }, 1800);
                }

                // WHOOP functionality (same as other pages)
                let whStats = null;
                function relTime(ts) {
                    if (!ts) return 'never';
                    const s = Math.floor((Date.now() - ts) / 1000);
                    if (s < 60) return 'just now';
                    if (s < 3600) return Math.floor(s/60) + ' min ago';
                    if (s < 86400) return Math.floor(s/3600) + ' h ago';
                    return Math.floor(s/86400) + ' d ago';
                }
                function renderWhoop(err) {
                    const t = loadJSON('whoop_tokens_v1', null);
                    const statusEl = $('whStatus'), txt = $('whStatusText'), syncEl = $('whSync'), action = $('whAction');
                    if (!t || !t.access) {
                        statusEl.classList.remove('on'); txt.textContent = 'Not connected';
                        syncEl.textContent = ''; $('whStats').style.display = 'none';
                        action.textContent = 'Connect on Health page';
                        return;
                    }
                    statusEl.classList.add('on'); txt.textContent = err ? 'Connected (sync failed)' : 'Connected';
                    const last = Number(localStorage.getItem('whoop_last_sync')) || 0;
                    syncEl.textContent = 'Last synced ' + relTime(last);
                    action.textContent = 'Sync now';
                    if (whStats) {
                        $('whStats').style.display = '';
                        $('whRec').textContent   = whStats.rec   != null ? whStats.rec + '%'  : '—';
                        $('whSleep').textContent = whStats.sleep != null ? whStats.sleep + '%' : '—';
                        $('whRhr').textContent   = whStats.rhr   != null ? whStats.rhr         : '—';
                    }
                }
                async function wRefresh(t) {
                    if (!t.refresh) return null;
                    try {
                        const r = await fetch('/api/whoop-refresh', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ refresh_token: t.refresh }) });
                        const j = await r.json();
                        if (j.access_token) { const n = { access:j.access_token, refresh:j.refresh_token||t.refresh, expires:Date.now()+(j.expires_in||3500)*1000 }; saveJSON('whoop_tokens_v1', n); return n; }
                    } catch (e) {}
                    return null;
                }
                async function wFetch(path, t) {
                    const [p, qs] = path.split('?');
                    const params = new URLSearchParams(qs || ''); params.set('path', p);
                    const r = await fetch('/api/whoop-data?' + params.toString(), { headers: { 'Authorization': 'Bearer ' + t.access, 'Accept':'application/json' } });
                    if (r.status === 401) { const n = await wRefresh(t); if (n) return wFetch(path, n); throw new Error('unauthorized'); }
                    if (!r.ok) throw new Error('whoop ' + r.status);
                    return r.json();
                }
                async function syncWhoop() {
                    let t = loadJSON('whoop_tokens_v1', null);
                    if (!t || !t.access) return;
                    if (t.expires && Date.now() > t.expires - 60000) { const n = await wRefresh(t); if (n) t = n; }
                    try {
                        const [rec, sleep] = await Promise.all([
                            wFetch('/recovery?limit=1', t).catch(()=>null),
                            wFetch('/activity/sleep?limit=1', t).catch(()=>null),
                        ]);
                        const r0 = rec && rec.records && rec.records[0];
                        const s0 = sleep && sleep.records && sleep.records[0];
                        whStats = {
                            rec:   r0 && r0.score && r0.score.recovery_score != null ? Math.round(r0.score.recovery_score) : null,
                            rhr:   r0 && r0.score && r0.score.resting_heart_rate != null ? Math.round(r0.score.resting_heart_rate) : null,
                            sleep: s0 && s0.score && s0.score.sleep_performance_percentage != null ? Math.round(s0.score.sleep_performance_percentage) : null,
                        };
                        localStorage.setItem('whoop_last_sync', String(Date.now()));
                        renderWhoop();
                    } catch (e) { renderWhoop(e); }
                }
                $('whAction').addEventListener('click', () => {
                    const t = loadJSON('whoop_tokens_v1', null);
                    if (!t || !t.access) { window.location.href = 'health.html'; return; }
                    $('whAction').textContent = 'Syncing…'; syncWhoop();
                });
            })();
        })();
    </script>
</body>
</html>
